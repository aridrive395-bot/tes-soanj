<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3E0">
<title>Kedai Kenangan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="deco" aria-hidden="true"></div>
<header id="top">
  <div class="bar"><i id="fill"></i></div>
  <p id="lbl" aria-live="polite"></p>
  <div class="music" role="group" aria-label="Pemutar musik">
    <button id="mp" class="icon" aria-label="Putar musik" aria-pressed="false"><span id="mi">▶</span><span class="eq" aria-hidden="true"><b></b><b></b><b></b></span></button>
    <input id="vol" type="range" min="0" max="1" step=".05" value=".6" aria-label="Volume">
  </div>
</header>
<main id="stage"></main>
<nav id="nav" aria-label="Navigasi adegan">
  <button id="prev" class="btn ghost" aria-label="Kembali">‹ Kembali</button>
  <button id="next" class="btn" disabled>Lanjut ›</button>
</nav>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden><div class="card" id="card"></div></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
